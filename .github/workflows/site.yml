name: site

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "config/backfill.txt"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Stats
        run: |
          python scripts/boat_stats.py > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boat/summary.json
          git commit -m "data: 集計を更新" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Build
        run: |
          pip install -q jinja2 markdown pyyaml
          python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
